<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Care Roster & Pay Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-[#4B2A68] text-white py-6 px-4 text-center shadow-md">
    <h1 class="text-2xl font-bold tracking-tight">Personal Roster Calculator</h1>
    <p class="text-xs text-purple-200 mt-1">Private Financial Estimation Tool</p>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-6 space-y-6">

    <!-- Payday Card 1 -->
    <div class="bg-[#4B2A68] text-white p-5 rounded-2xl shadow-lg">
      <p class="text-xs uppercase tracking-wider text-purple-200 font-semibold">Next Immediate Payday</p>
      <p id="nextPaydayDate" class="text-xl font-bold mt-1">Calculating...</p>
      <p id="nextPaydayPeriod" class="text-xs text-purple-300 mt-0.5">Period: --</p>
      <div class="border-t border-purple-400/20 my-3"></div>
      <div class="flex justify-between items-center text-sm">
        <div>
          <span class="text-xs text-purple-300 block">Gross Estimate</span>
          <span id="nextPaydayGross" class="font-bold text-lg">€0.00</span>
        </div>
        <div class="text-right">
          <span class="text-xs text-purple-300 block">Net (Est.)</span>
          <span id="nextPaydayNet" class="font-bold text-lg text-emerald-300">€0.00</span>
        </div>
      </div>
    </div>

    <!-- Payday Card 2 -->
    <div class="bg-[#1E2538] text-white p-5 rounded-2xl shadow-lg">
      <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Following Payday</p>
      <p id="followingPaydayDate" class="text-xl font-bold mt-1">Calculating...</p>
      <p id="followingPaydayPeriod" class="text-xs text-slate-400 mt-0.5">Period: --</p>
      <div class="border-t border-slate-700/50 my-3"></div>
      <div class="flex justify-between items-center text-sm">
        <div>
          <span class="text-xs text-slate-400 block">Gross Estimate</span>
          <span id="followingPaydayGross" class="font-bold text-lg">€0.00</span>
        </div>
        <div class="text-right">
          <span class="text-xs text-slate-400 block">Net (Est.)</span>
          <span id="followingPaydayNet" class="font-bold text-lg text-teal-300">€0.00</span>
        </div>
      </div>
    </div>

    <!-- Quick Shift Logger Bar -->
    <div id="loggerBar" class="bg-white p-4 rounded-2xl shadow-md border border-slate-200 hidden">
      <p id="selectedDateTitle" class="font-bold text-slate-800 text-sm mb-2">Select Shift</p>
      <div class="grid grid-cols-5 gap-1">
        <button onclick="setShift('DS')" class="bg-blue-600 text-white py-2 rounded-lg text-xs font-bold">DS</button>
        <button onclick="setShift('WN')" class="bg-teal-600 text-white py-2 rounded-lg text-xs font-bold">WN</button>
        <button onclick="setShift('SO')" class="bg-purple-600 text-white py-2 rounded-lg text-xs font-bold">SO</button>
        <button onclick="setShift('TR')" class="bg-orange-600 text-white py-2 rounded-lg text-xs font-bold">TR</button>
        <button onclick="setShift(null)" class="bg-slate-200 text-red-600 py-2 rounded-lg text-xs font-bold">Clear</button>
      </div>
    </div>

    <!-- Calendar Section -->
    <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
      <div class="flex items-center justify-between gap-2 mb-4 pb-3 border-b border-slate-100">
        <div class="flex items-center gap-2">
          <select id="monthSelect" onchange="changeCalendarView()" class="bg-slate-100 font-bold text-slate-800 text-sm py-1 px-2 rounded-lg border border-slate-300">
            <option value="0">January</option>
            <option value="1">February</option>
            <option value="2">March</option>
            <option value="3">April</option>
            <option value="4">May</option>
            <option value="5">June</option>
            <option value="6">July</option>
            <option value="7">August</option>
            <option value="8">September</option>
            <option value="9">October</option>
            <option value="10">November</option>
            <option value="11">December</option>
          </select>
          <select id="yearSelect" onchange="changeCalendarView()" class="bg-slate-100 font-bold text-slate-800 text-sm py-1 px-2 rounded-lg border border-slate-300">
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
          </select>
        </div>
        <button onclick="jumpToCurrentMonth()" class="text-xs font-semibold bg-purple-50 text-purple-700 px-3 py-1.5 rounded-lg">Today</button>
      </div>

      <div class="grid grid-cols-7 text-center text-xs font-bold text-slate-400 mb-2">
        <div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>
      </div>

      <div id="calendarDays" class="grid grid-cols-7 gap-1.5 text-center text-sm font-medium"></div>
    </div>

  </main>

  <script>
    const today = new Date();
    let currentDisplayMonth = today.getMonth();
    let currentDisplayYear = today.getFullYear();
    let selectedDateStr = null;

    const SHIFT_RATES = { 'DS': 180.00, 'WN': 210.00, 'SO': 150.00, 'TR': 120.00 };
    const NET_PAY_RATIO = 0.80;

    const STORAGE_KEY = 'orchard_roster_data';
    let loggedShifts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

    // Dynamic Pay Period Rollover Engine
    function getPayPeriods() {
      // Known reference anchor payday: Thursday 22 Jan 2026 (Period: 29 Dec 2025 - 11 Jan 2026)
      const anchorPeriodStart = new Date(2025, 11, 29); // 29 Dec 2025
      const anchorPayday = new Date(2026, 0, 22);       // 22 Jan 2026

      const msPerDay = 24 * 60 * 60 * 1000;
      const todayZero = new Date(today.getFullYear(), today.getMonth(), today.getDate());

      // Days since reference payday
      const daysDiff = Math.floor((todayZero - anchorPayday) / msPerDay);
      let cyclesPassed = Math.floor(daysDiff / 14);

      // Advance to next active cycle if today has passed or reached payday
      if (daysDiff >= 0) {
        cyclesPassed += 1;
      }

      // Next Payday (Period 1)
      const p1Payday = new Date(anchorPayday.getTime() + cyclesPassed * 14 * msPerDay);
      const p1Start = new Date(anchorPeriodStart.getTime() + cyclesPassed * 14 * msPerDay);
      const p1End = new Date(p1Start.getTime() + 13 * msPerDay);

      // Following Payday (Period 2)
      const p2Payday = new Date(p1Payday.getTime() + 14 * msPerDay);
      const p2Start = new Date(p1Start.getTime() + 14 * msPerDay);
      const p2End = new Date(p2Start.getTime() + 13 * msPerDay);

      return {
        p1: { start: p1Start, end: p1End, payday: p1Payday },
        p2: { start: p2Start, end: p2End, payday: p2Payday }
      };
    }

    function formatDate(d) {
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${d.getDate()} ${months[d.getMonth()]}`;
    }

    function formatPayday(d) {
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function initCalendar() {
      document.getElementById('monthSelect').value = currentDisplayMonth;
      document.getElementById('yearSelect').value = currentDisplayYear;
      renderCalendar();
      calculatePay();
    }

    function changeCalendarView() {
      currentDisplayMonth = parseInt(document.getElementById('monthSelect').value);
      currentDisplayYear = parseInt(document.getElementById('yearSelect').value);
      renderCalendar();
    }

    function jumpToCurrentMonth() {
      currentDisplayMonth = today.getMonth();
      currentDisplayYear = today.getFullYear();
      document.getElementById('monthSelect').value = currentDisplayMonth;
      document.getElementById('yearSelect').value = currentDisplayYear;
      renderCalendar();
    }

    function renderCalendar() {
      const container = document.getElementById('calendarDays');
      container.innerHTML = '';

      const firstDay = new Date(currentDisplayYear, currentDisplayMonth, 1);
      const lastDay = new Date(currentDisplayYear, currentDisplayMonth + 1, 0);

      let startingDay = firstDay.getDay() - 1;
      if (startingDay === -1) startingDay = 6;

      for (let i = 0; i < startingDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = "h-10";
        container.appendChild(emptyCell);
      }

      for (let day = 1; day <= lastDay.getDate(); day++) {
        const dateString = `${currentDisplayYear}-${String(currentDisplayMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayCell = document.createElement('div');
        
        const isToday = day === today.getDate() && currentDisplayMonth === today.getMonth() && currentDisplayYear === today.getFullYear();
        let cellClasses = "h-10 rounded-xl flex flex-col items-center justify-center cursor-pointer border transition text-xs relative ";
        
        if (isToday) {
          cellClasses += "border-purple-600 bg-purple-50 font-bold text-purple-900 ";
        } else {
          cellClasses += "border-slate-100 bg-slate-50 text-slate-700 ";
        }

        const shift = loggedShifts[dateString];
        let shiftBadge = '';
        if (shift === 'DS') shiftBadge = '<span class="text-[9px] font-bold text-blue-600">DS</span>';
        if (shift === 'WN') shiftBadge = '<span class="text-[9px] font-bold text-teal-600">WN</span>';
        if (shift === 'SO') shiftBadge = '<span class="text-[9px] font-bold text-purple-600">SO</span>';
        if (shift === 'TR') shiftBadge = '<span class="text-[9px] font-bold text-orange-600">TR</span>';

        dayCell.className = cellClasses;
        dayCell.innerHTML = `<span>${day}</span>${shiftBadge}`;
        dayCell.setAttribute('onclick', `selectDate('${dateString}')`);

        container.appendChild(dayCell);
      }
    }

    function selectDate(dateStr) {
      selectedDateStr = dateStr;
      document.getElementById('selectedDateTitle').innerText = `Select shift for ${dateStr}:`;
      document.getElementById('loggerBar').classList.remove('hidden');
    }

    function setShift(shiftType) {
      if (!selectedDateStr) return;
      if (shiftType) {
        loggedShifts[selectedDateStr] = shiftType;
      } else {
        delete loggedShifts[selectedDateStr];
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(loggedShifts));
      renderCalendar();
      calculatePay();
      document.getElementById('loggerBar').classList.add('hidden');
    }

    function calculatePay() {
      const periods = getPayPeriods();

      // Set Card Headers Dynamically
      document.getElementById('nextPaydayDate').innerText = formatPayday(periods.p1.payday);
      document.getElementById('nextPaydayPeriod').innerText = `Period: ${formatDate(periods.p1.start)} to ${formatDate(periods.p1.end)}`;

      document.getElementById('followingPaydayDate').innerText = formatPayday(periods.p2.payday);
      document.getElementById('followingPaydayPeriod').innerText = `Period: ${formatDate(periods.p2.start)} to ${formatDate(periods.p2.end)}`;

      let p1Gross = 0, p2Gross = 0;

      Object.keys(loggedShifts).forEach(dateStr => {
        const shiftType = loggedShifts[dateStr];
        const rate = SHIFT_RATES[shiftType] || 0;
        
        // Fix Date parsing to avoid timezone offset errors
        const parts = dateStr.split('-');
        const shiftDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));

        if (shiftDate >= periods.p1.start && shiftDate <= periods.p1.end) {
          p1Gross += rate;
        } else if (shiftDate >= periods.p2.start && shiftDate <= periods.p2.end) {
          p2Gross += rate;
        }
      });

      document.getElementById('nextPaydayGross').innerText = `€${p1Gross.toFixed(2)}`;
      document.getElementById('nextPaydayNet').innerText = `€${(p1Gross * NET_PAY_RATIO).toFixed(2)}`;

      document.getElementById('followingPaydayGross').innerText = `€${p2Gross.toFixed(2)}`;
      document.getElementById('followingPaydayNet').innerText = `€${(p2Gross * NET_PAY_RATIO).toFixed(2)}`;
    }

    initCalendar();
  </script>
</body>
</html>
